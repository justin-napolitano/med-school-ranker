name: Deploy Public Site

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ASTRO_BASE_PATH: /${{ github.event.repository.name }}
  ASTRO_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build publish-safe Astro site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: uv sync --locked --dev

      - name: Rebuild public data outputs
        run: |
          uv run med-school-integrate-sources
          uv run med-school-apply-official-stats
          uv run med-school-apply-aacom-do-stats
          uv run med-school-build-rankings
          uv run med-school-build-site --site-mode publish_safe

      - name: Validate
        run: uv run med-school-validate

      - name: Test
        run: uv run pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Astro frontend
        working-directory: frontend
        run: npm run build

      - name: Smoke test Astro output
        working-directory: frontend
        run: npm run smoke

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
