[project]
name = "med-school-ranker"
version = "0.1.0"
description = "CSV and XLSX medical school ranking decision model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.5",
    "pypdf>=6.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[project.scripts]
med-school-build-rankings = "med_school_ranker.rankings:main"
med-school-build-private-rankings = "med_school_ranker.rankings:main_private"
med-school-build-workbook = "med_school_ranker.workbook:main"
med-school-build-site = "med_school_ranker.site:main"
med-school-build-all = "med_school_ranker.bundle:main"
med-school-build-final-list = "med_school_ranker.final_list:main"
med-school-integrate-sources = "med_school_ranker.source_integration:main"
med-school-discover-official-stats = "med_school_ranker.official_stats_discovery:main"
med-school-extract-official-stats = "med_school_ranker.official_stats_extraction:main"
med-school-apply-official-stats = "med_school_ranker.official_stats_apply:main"
med-school-discover-md-official-stats = "med_school_ranker.md_official_discovery:main"
med-school-extract-md-official-stats = "med_school_ranker.md_official_extraction:main"
med-school-apply-md-official-stats = "med_school_ranker.md_official_apply:main"
med-school-discover-aacom-do-profiles = "med_school_ranker.aacom_do_discovery:main"
med-school-extract-aacom-do-stats = "med_school_ranker.aacom_do_extraction:main"
med-school-apply-aacom-do-stats = "med_school_ranker.aacom_do_apply:main"
med-school-import-reviewer-state = "med_school_ranker.reviewer_state:main"
med-school-validate = "med_school_ranker.validation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
